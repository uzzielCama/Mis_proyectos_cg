<!DOCTYPE html>

<!-- Indicamos en que idioma se muestra la pagina web 
	Con la siguiente etiqueta -->
<html lang ="es">

	<!--Existen tambien mas atributos para la etiqueta html
	con diferentes usos, por ejemplo:
	

	dir: dirección del texto.

    	ltr: de izquierda a derecha.
    	rtl: de derecha a izquierda.
    	auto: el navegador determina la dirección.
	
		class: asigna una clase CSS.

		id: asigna un identificador único.

		data-*: permite guardar datos personalizados.

		xmlns: se utiliza principalmente en XHTML o XML.
	
	Recurda usar = para declarar el atributo 
	despues agrega "" para encerrar el valor del atributo
